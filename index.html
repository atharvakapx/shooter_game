<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Arena FPS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Neon Arena FPS game">
        <canvas id="game" width="960" height="540"></canvas>

        <div class="hud hud-top">
          <div class="hud-card vital-card">
            <div class="readout">
              <span>HP</span>
              <strong id="playerHealth">100</strong>
              <span>ARM</span>
              <strong id="playerArmor">0</strong>
            </div>
            <div class="meter" aria-hidden="true">
              <div id="playerHealthBar" class="meter-fill player-fill"></div>
            </div>
            <div class="meter" aria-hidden="true">
              <div id="playerArmorBar" class="meter-fill armor-fill"></div>
            </div>
          </div>

          <div class="status" id="statusText">Click Start</div>

          <div class="hud-card vital-card">
            <div class="readout">
              <span id="roundLabel">ROUND 1</span>
              <strong id="enemyHealth">4/4</strong>
            </div>
            <div class="meter" aria-hidden="true">
              <div id="enemyHealthBar" class="meter-fill enemy-fill"></div>
            </div>
          </div>
        </div>

        <div class="hud hud-bottom">
          <div class="hud-card weapon-card">
            <div class="readout">
              <span id="weaponName">RIFLE</span>
              <strong id="weaponState">30</strong>
            </div>
            <div class="meter" aria-hidden="true">
              <div id="weaponChargeBar" class="meter-fill weapon-fill"></div>
            </div>
          </div>

          <button id="startBtn" type="button">Start</button>

          <div class="hud-card intel-card">
            <div>
              <span>RANGE</span>
              <strong id="enemyDistance">--m</strong>
            </div>
            <div>
              <span>SCORE</span>
              <strong id="scoreEl">0</strong>
            </div>
          </div>
        </div>

        <div class="hud-card controls-card">
          <span>WASD MOVE</span>
          <span>SHIFT SPRINT</span>
          <span>SPACE JUMP</span>
          <span>C CROUCH</span>
          <span>Q WEAPON</span>
          <span>R RELOAD</span>
          <span>CLICK FIRE</span>
        </div>

        <div class="crosshair" aria-hidden="true"></div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
